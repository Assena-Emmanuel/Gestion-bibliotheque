services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: bibliodb
    ports:
      - "5434:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8082:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped